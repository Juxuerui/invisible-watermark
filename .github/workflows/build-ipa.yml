name: Build IPA

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Run algorithm self tests
        run: bash run_tests.sh

      - name: Build full app
        run: |
          xcodebuild \
            -project InvisibleWatermark.xcodeproj \
            -scheme InvisibleWatermark \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/full-DD \
            PRODUCT_BUNDLE_IDENTIFIER=com.watermark.app \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Build activation tool
        run: |
          xcodebuild \
            -project InvisibleWatermark.xcodeproj \
            -scheme InvisibleWatermark \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/tool-DD \
            PRODUCT_BUNDLE_IDENTIFIER=com.watermark.activationtool \
            SWIFT_ACTIVE_COMPILATION_CONDITIONS=ACTIVATION_TOOL \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package IPAs
        run: |
          set -e
          # iOS requires the archive root to be exactly "Payload/".
          # Two variants need two staging roots, so build each in its own dir.
          for pair in "InvisibleWatermark:full-DD" "ActivationTool:tool-DD"; do
            name="${pair%%:*}"
            dd="${pair##*:}"
            app="build/$dd/Build/Products/Release-iphoneos/InvisibleWatermark.app"
            stage="build/stage-$name"
            rm -rf "$stage"
            mkdir -p "$stage/Payload"
            cp -R "$app" "$stage/Payload/InvisibleWatermark.app"
            (cd "$stage" && zip -qry "../$name-unsigned.ipa" Payload)
            # Sanity check: the archive must contain Payload/ at the root.
            unzip -l "build/$name-unsigned.ipa" | grep -q "Payload/InvisibleWatermark.app/" \
              || { echo "bad archive: $name"; exit 1; }
          done
          ls -lh build/*.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: unsigned-ipas
          path: build/*-unsigned.ipa
          retention-days: 30
